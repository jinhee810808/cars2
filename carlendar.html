<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>컴팩트 스마트 캘린더</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: #f1f3f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    
    /* 컴팩트 캘린더 카트 */
    .calendar-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 16px;
      border: 1px solid #eaeaea;
    }
    
    /* API 키 입력 상자 */
    .key-box {
      margin-bottom: 12px;
      display: flex;
      gap: 6px;
    }
    .key-box input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .key-box input:focus { border-color: #4c6ef5; }
    .key-box button {
      background: #4c6ef5;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      transition: background 0.2s;
    }
    .key-box button:hover { background: #3b5bdb; }
    
    /* 상단 타이틀 및 컨트롤 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title-area h2 {
      font-size: 15px;
      color: #212529;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .btn-group {
      display: flex;
      gap: 4px;
    }
    .nav-btn {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: #495057;
      font-size: 11px;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      background: #e9ecef;
      color: #212529;
    }
    
    /* 요일 헤더 */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 11px;
      color: #868e96;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f1f3f5;
    }
    .weekday.sun { color: #fa5252; }
    .weekday.sat { color: #4c6ef5; }

    /* 날짜 그리드 */
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .day-cell {
      min-height: 44px;
      border-radius: 6px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #fafbfe;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .day-cell:hover { background: #edf2ff; }
    .day-cell.other-month {
      background: transparent;
      opacity: 0.25;
    }
    .day-cell.today {
      background: #edf2ff;
      border-color: #748ffc;
    }
    
    .day-num {
      font-size: 11px;
      font-weight: 600;
      color: #343a40;
      line-height: 1;
      margin-bottom: 2px;
    }
    .day-cell.sun .day-num { color: #fa5252; }
    .day-cell.sat .day-num { color: #4c6ef5; }
    .day-cell.rest-day .day-num { color: #fa5252; }
    
    /* 배지 스타일 */
    .badge-container {
      display: flex;
      flex-direction: column;
      gap: 1px;
      width: 100%;
      overflow: hidden;
    }
    .badge {
      font-size: 9px;
      padding: 1px 3px;
      border-radius: 3px;
      line-height: 1.1;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      font-weight: 500;
      letter-spacing: -0.3px;
    }
    .badge.holiday {
      background: #ffe3e3;
      color: #e03131;
    }
    .badge.solar-term {
      background: #e7f5ff;
      color: #1971c2;
    }
  </style>
</head>
<body>

<div class="calendar-card">
  <div class="key-box">
    <input type="text" id="apiKey" placeholder="공공데이터포털 일반 인증키 (미입력 시 테스트 데이터)" />
    <button onclick="renderCalendar()">적용</button>
  </div>

  <div class="header">
    <div class="title-area">
      <h2 id="calendarTitle">2026년 8월</h2>
    </div>
    <div class="btn-group">
      <button class="nav-btn" onclick="prevMonth()">◀</button>
      <button class="nav-btn" onclick="goToday()">오늘</button>
      <button class="nav-btn" onclick="nextMonth()">▶</button>
    </div>
  </div>

  <div class="weekdays">
    <div class="weekday sun">일</div>
    <div class="weekday">월</div>
    <div class="weekday">화</div>
    <div class="weekday">수</div>
    <div class="weekday">목</div>
    <div class="weekday">금</div>
    <div class="weekday sat">토</div>
  </div>

  <div class="grid" id="daysGrid"></div>
</div>

<script>
  let currentDate = new Date();

  // 테스트용 예시 데이터
  const mockSpecialDays = {
    "20260807": [{ type: 'term', name: '입추' }],
    "20260815": [{ type: 'holiday', name: '광복절', isHoliday: 'Y' }],
    "20260823": [{ type: 'term', name: '처서' }]
  };

  async function fetchSpecialDays(year, month) {
    const key = document.getElementById('apiKey').value.trim();
    const formattedMonth = String(month).padStart(2, '0');
    
    if (!key) return mockSpecialDays;

    const specialMap = {};
    const baseUrl = "https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService";
    
    try {
      // 1. 공휴일 조회
      const holiUrl = `${baseUrl}/getRestDeInfo?serviceKey=${encodeURIComponent(key)}&solYear=${year}&solMonth=${formattedMonth}&_type=json`;
      const holiRes = await fetch(holiUrl);
      const holiData = await holiRes.json();
      let holiItems = holiData?.response?.body?.items?.item || [];
      if (!Array.isArray(holiItems) && holiItems.locdate) holiItems = [holiItems];

      holiItems.forEach(item => {
        const d = String(item.locdate);
        if (!specialMap[d]) specialMap[d] = [];
        specialMap[d].push({ type: 'holiday', name: item.dateName, isHoliday: item.isHoliday });
      });

      // 2. 24절기 조회
      const termUrl = `${baseUrl}/get24DivisionsInfo?serviceKey=${encodeURIComponent(key)}&solYear=${year}&solMonth=${formattedMonth}&_type=json`;
      const termRes = await fetch(termUrl);
      const termData = await termRes.json();
      let termItems = termData?.response?.body?.items?.item || [];
      if (!Array.isArray(termItems) && termItems.locdate) termItems = [termItems];

      termItems.forEach(item => {
        const d = String(item.locdate);
        if (!specialMap[d]) specialMap[d] = [];
        specialMap[d].push({ type: 'term', name: item.dateName });
      });

      return specialMap;
    } catch (err) {
      console.warn("API 호출 실패 또는 CORS 제한으로 테스트 데이터를 표시합니다.", err);
      return mockSpecialDays;
    }
  }

  async function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth() + 1;

    document.getElementById('calendarTitle').innerText = `${year}년 ${month}월`;
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '<div style="grid-column: span 7; text-align: center; padding: 15px; font-size: 11px; color: #888;">불러오는 중...</div>';

    const specialData = await fetchSpecialDays(year, month);
    grid.innerHTML = '';

    const firstDayIndex = new Date(year, month - 1, 1).getDay();
    const lastDate = new Date(year, month, 0).getDate();
    const prevLastDate = new Date(year, month - 1, 0).getDate();
    const today = new Date();

    // 이전 달
    for (let i = firstDayIndex; i > 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'day-cell other-month';
      cell.innerHTML = `<span class="day-num">${prevLastDate - i + 1}</span>`;
      grid.appendChild(cell);
    }

    // 이번 달
    for (let d = 1; d <= lastDate; d++) {
      const dayOfWeek = (firstDayIndex + d - 1) % 7;
      const dateKey = `${year}${String(month).padStart(2, '0')}${String(d).padStart(2, '0')}`;
      const dayEvents = specialData[dateKey] || [];

      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dayOfWeek === 0) cell.classList.add('sun');
      if (dayOfWeek === 6) cell.classList.add('sat');

      if (today.getFullYear() === year && today.getMonth() + 1 === month && today.getDate() === d) {
        cell.classList.add('today');
      }

      let tagsHtml = '';
      dayEvents.forEach(e => {
        if (e.type === 'holiday') {
          tagsHtml += `<div class="badge holiday">${e.name}</div>`;
          if (e.isHoliday === 'Y') cell.classList.add('rest-day');
        } else if (e.type === 'term') {
          tagsHtml += `<div class="badge solar-term">${e.name}</div>`;
        }
      });

      cell.innerHTML = `
        <span class="day-num">${d}</span>
        <div class="badge-container">${tagsHtml}</div>
      `;
      grid.appendChild(cell);
    }

    // 다음 달
    const totalCells = firstDayIndex + lastDate;
    const remainingCells = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
    for (let i = 1; i <= remainingCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell other-month';
      cell.innerHTML = `<span class="day-num">${i}</span>`;
      grid.appendChild(cell);
    }
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  function goToday() {
    currentDate = new Date();
    renderCalendar();
  }

  renderCalendar();
</script>

</body>
</html>
