    <script>
        // 백엔드 API 서버 기본 주소
        const SERVER_URL = "https://charm3007.cafe24.com/cars/api";

        let currentUserName = "";
        let currentBranchName = "";
        let currentUserRole = "";
        let currentVehicleNum = "";

        let MOCK_BRANCHES = [];
        let MOCK_USERS = [];
        let MOCK_VEHICLES = [];
        let MOCK_HISTORIES = [];

        // ----------------------------------------------------
        // 1. 🔑 로그인 처리 함수
        // ----------------------------------------------------
        async function handleLogin(e) {
            if (e) e.preventDefault();

            const idInput = document.getElementById('user-id');
            const pwInput = document.getElementById('user-pw');
            const loginError = document.getElementById('login-error');

            if (!idInput || !pwInput) return;

            const id = idInput.value.trim();
            const pw = pwInput.value.trim();

            if (!id || !pw) {
                alert("아이디와 비밀번호를 입력해 주세요.");
                return;
            } 

            try {
                const response = await fetch(`${SERVER_URL}/login_user.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: id, user_pw: pw })
                });

                const result = await response.json();

                if (result.success) {
                    const userInfo = result.user || result;

                    currentUserName = userInfo.name || "";
                    currentBranchName = userInfo.branch || "";
                    currentUserRole = userInfo.role || "";

                    if (loginError) loginError.classList.add('hidden');

                    const loginScreen = document.getElementById('login-screen');
                    const mainScreen = document.getElementById('main-screen');
                    if (loginScreen) {
                        loginScreen.classList.add('hidden');
                        loginScreen.style.display = 'none';
                    }
                    if (mainScreen) {
                        mainScreen.classList.remove('hidden');
                        mainScreen.style.display = 'flex';
                    }

                    const welcomeEl = document.getElementById('welcome-msg');
                    const branchEl = document.getElementById('branch-msg');
                    if (welcomeEl) welcomeEl.innerText = `👋 ${currentUserName} 님 반갑습니다`;
                    if (branchEl) branchEl.innerText = `소속 지점: ${currentBranchName}`;

                    await loadServerData();
                    setDefaultDates();

                } else {
                    if (loginError) {
                        loginError.innerText = result.message || "아이디 또는 비밀번호가 올바르지 않습니다.";
                        loginError.classList.remove('hidden');
                    } else {
                        alert(result.message || "로그인에 실패했습니다.");
                    }
                }
            } catch (err) {
                console.error("로그인 에러:", err);
                alert("서버 통신 중 오류가 발생했습니다.");
            }
        }

        // ----------------------------------------------------
        // 2. 🚖 서버 데이터 동기화
        // ----------------------------------------------------
        async function loadServerData() {
            try {
                const response = await fetch(`${SERVER_URL}/get_initial_data.php`);
                const data = await response.json();

                if (data.success) {
                    MOCK_BRANCHES = data.branches || [];
                    MOCK_USERS = data.users || [];
                    MOCK_VEHICLES = data.vehicles || [];
                    MOCK_HISTORIES = data.histories || [];

                    matchVehicleByBranch(currentBranchName);
                    renderHistorySummary();

                    const historyScreen = document.getElementById('history-screen');
                    if (historyScreen && !historyScreen.classList.contains('hidden')) {
                        renderFullHistoryList();
                    }
                } else {
                    console.error("데이터 동기화 실패:", data.message);
                }
            } catch (err) {
                console.error("서버 로딩 오류:", err);
            }
        }

        // ----------------------------------------------------
        // 3. 📝 운행 / 지출 기록 등록
        // ----------------------------------------------------
        async function handleSubmit(e) {
            e.preventDefault();
            const logType = document.getElementById('log-type').value;

            if (!currentVehicleNum) {
                alert("지점에 배정된 매칭 차량이 없습니다.");
                return;
            }

            let payload = {
                action: 'add_log',
                vehicle_num: currentVehicleNum,
                type: logType,
                branch_name: currentBranchName,
                user_name: currentUserName,
                memo: document.getElementById('content-memo').value.trim()
            };

            if (logType === "운행") {
                const startDate = document.getElementById('start-date').value;
                const startTime = document.getElementById('start-time').value || "00:00";
                const endDate = document.getElementById('end-date').value;
                const endTime = document.getElementById('end-time').value || "00:00";

                payload.start_datetime = `${startDate} ${startTime}`;
                payload.start_km = Number(document.getElementById('start-km').value) || 0;
                payload.end_datetime = `${endDate} ${endTime}`;
                payload.end_km = Number(document.getElementById('end-km').value) || 0;
                payload.purpose = document.getElementById('drive-purpose').value;
            } else {
                payload.expense_date = document.getElementById('expense-date').value;
                payload.expense_type = document.getElementById('expense-type').value;
                payload.amount = Number(document.getElementById('amount').value) || 0;
            }

            try {
                const response = await fetch(`${SERVER_URL}/manage.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    alert("성공적으로 등록되었습니다.");
                    
                    document.getElementById('start-km').value = "";
                    document.getElementById('end-km').value = "";
                    document.getElementById('amount').value = "";
                    document.getElementById('content-memo').value = "";
                    setDefaultDates();

                    await loadServerData();
                } else {
                    alert("등록 실패: " + (result.message || "오류가 발생했습니다."));
                }
            } catch (err) {
                console.error("기록 등록 통신 오류:", err);
                alert("서버 통신 오류로 저장하지 못했습니다.");
            }
        }

        // ----------------------------------------------------
        // 4. 🔓 로그아웃
        // ----------------------------------------------------
        function handleLogout() {
            currentUserName = "";
            currentBranchName = "";
            currentUserRole = "";
            currentVehicleNum = "";

            const idEl = document.getElementById('user-id');
            const pwEl = document.getElementById('user-pw');
            if (idEl) idEl.value = "";
            if (pwEl) pwEl.value = "";

            const loginScreen = document.getElementById('login-screen');
            const mainScreen = document.getElementById('main-screen');
            const historyScreen = document.getElementById('history-screen');

            if (mainScreen) {
                mainScreen.style.display = 'none';
                mainScreen.classList.add('hidden');
            }
            if (historyScreen) {
                historyScreen.style.display = 'none';
                historyScreen.classList.add('hidden');
            }
            if (loginScreen) {
                loginScreen.style.display = 'flex';
                loginScreen.classList.remove('hidden');
            }
        }

        // ----------------------------------------------------
        // 5. 🖥️ 화면 전환 및 렌더링 헬퍼 함수
        // ----------------------------------------------------
        function navigateTo(screenName) {
            const main1 = document.getElementById('main1');
            const historyScreen = document.getElementById('history-screen');

            window.scrollTo(0, 0);

            if (screenName === 'main') {
                if (main1) main1.classList.remove('hidden');
                if (historyScreen) historyScreen.classList.add('hidden');
                renderHistorySummary();
            } else if (screenName === 'history') {
                if (main1) main1.classList.add('hidden');
                if (historyScreen) historyScreen.classList.remove('hidden');
                renderFullHistoryList();
            }
        }

        function setDefaultDates() {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${hours}:${minutes}`;

            document.getElementById('start-date').value = today;
            document.getElementById('start-time').value = currentTime;
            document.getElementById('end-date').value = today;
            document.getElementById('end-time').value = currentTime;
            document.getElementById('expense-date').value = today;
        }

        function matchVehicleByBranch(branchName) {
            const displayEl = document.getElementById('matched-vehicle-display');
            const matchedCar = MOCK_VEHICLES.find(car => car.branch === branchName);
            if (matchedCar) {
                currentVehicleNum = matchedCar.vehicle_num;
                displayEl.innerText = `${matchedCar.vehicle_num} (${matchedCar.model_name} / ${matchedCar.fuel || '휘발유'})`;
            } else {
                currentVehicleNum = "";
                displayEl.innerText = "현재 배정된 차량이 없습니다.";
            }
        }

        function createCardHTML(item) {
            const startKm = Number(item.start_km || 0);
            const endKm = Number(item.end_km || 0);
            
            const startKmFormatted = startKm.toLocaleString();
            const endKmFormatted = endKm.toLocaleString();
            const distanceFormatted = (endKm - startKm).toLocaleString();
            const amountFormatted = Number(item.amount || 0).toLocaleString();

            if (item.type === "운행") {
                return `
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-1.5">
                            <span class="bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded text-[11px]">📋 운행</span>
                            <span class="text-xs font-semibold text-gray-700">${item.user_name}</span>
                        </div>
                        <span class="text-xs bg-slate-100 text-slate-600 font-medium px-2 py-0.5 rounded">${item.purpose || '일반업무용'}</span>
                    </div>
                    <div class="space-y-1 text-xs text-gray-700">
                        <p>🛫 <span class="font-semibold text-gray-900">출발:</span> ${item.start_datetime} (${startKmFormatted} km)</p>
                        <p>🛬 <span class="font-semibold text-emerald-700">도착:</span> ${item.end_datetime} (${endKmFormatted} km, 주행: <b class="text-blue-600">${distanceFormatted} km</b>)</p>
                    </div>
                `;
            } else {
                return `
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-1.5">
                            <span class="bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded text-[11px]">💳 지출</span>
                            <span class="text-xs font-semibold text-gray-700">${item.user_name}</span>
                        </div>
                        <span class="text-xs font-bold text-amber-700">${item.expense_type}</span>
                    </div>
                    <div class="space-y-1 text-xs text-gray-700">
                        <p>📅 <span class="font-semibold text-gray-900">지출일:</span> ${item.expense_date}</p>
                        <p class="text-blue-600 font-extrabold text-sm">💰 금액: ${amountFormatted} 원</p>
                    </div>
                `;
            }
        }

        function renderHistorySummary() {
            const container = document.getElementById('main-history-summary');
            container.innerHTML = "";

            const filtered = MOCK_HISTORIES.filter(i => i.vehicle_num === currentVehicleNum);
            document.getElementById('history-count').innerText = `${filtered.length}건`;

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-10">등록된 최근 내역이 없습니다.</p>`;
                return;
            }

            // 최근 내역 상위 5개 표시
            filtered.slice(0, 5).forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 hover:bg-slate-100 transition border border-slate-200 p-3.5 rounded-xl space-y-1.5 text-xs";
                card.innerHTML = createCardHTML(item) + `${item.memo ? `<p class="text-slate-400 text-[11px] border-t pt-1.5 mt-1.5">📝 ${item.memo}</p>` : ''}`;
                container.appendChild(card);
            });
        }

        function renderFullHistoryList() {
            const container = document.getElementById('full-history-list');
            container.innerHTML = "";

            const filtered = MOCK_HISTORIES.filter(i => i.vehicle_num === currentVehicleNum);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-12">전체 기록이 없습니다.</p>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 p-4 rounded-xl space-y-2 text-xs shadow-sm";
                card.innerHTML = createCardHTML(item) + `${item.memo ? `<p class="text-slate-400 text-xs border-t pt-2 mt-2">📝 ${item.memo}</p>` : ''}`;
                container.appendChild(card);
            });
        }

        function switchTab(type) {
            document.getElementById('log-type').value = type === 'drive' ? '운행' : '지출/정비';
            
            const tabDrive = document.getElementById('tab-drive');
            const tabExpense = document.getElementById('tab-expense');
            
            if (type === 'drive') {
                tabDrive.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition bg-white text-blue-600 shadow-sm";
                tabExpense.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition text-slate-500 hover:text-slate-800";
                document.getElementById('drive-fields').classList.remove('hidden');
                document.getElementById('expense-fields').classList.add('hidden');
            } else {
                tabDrive.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition text-slate-500 hover:text-slate-800";
                tabExpense.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition bg-white text-blue-600 shadow-sm";
                document.getElementById('drive-fields').classList.add('hidden');
                document.getElementById('expense-fields').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
